services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      FRONTEND_ORIGIN: http://localhost:5173
      PREVIEW_BASE_URL: http://localhost:8001
      PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      build-worker:
        condition: service_started

  build-worker:
    build: ./build-worker
    restart: unless-stopped
    volumes:
      - preview-data:/data/previews
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 1536m
    cpus: 1.25
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID

  web:
    build: .
    restart: unless-stopped
    ports:
      - "5173:80"
      - "8001:81"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
  preview-data:
